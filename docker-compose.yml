# Infrastructure only:        docker compose up -d
# Full stack, 3 workers:      docker compose --profile app up -d --build --scale worker=3
x-app-env: &app-env
  DATABASE_URL: postgresql://reachinbox:reachinbox@postgres:5432/reachinbox?schema=public
  REDIS_URL: redis://redis:6379
  ELASTICSEARCH_URL: http://elasticsearch:9200

services:
  postgres:
    image: postgres:16-alpine
    environment:
      { POSTGRES_USER: reachinbox, POSTGRES_PASSWORD: reachinbox, POSTGRES_DB: reachinbox }
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U reachinbox'], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    # AOF with fsync every second: at most one second of queue writes is at risk,
    # and PostgreSQL reconciliation restores any job lost in that window.
    # noeviction: BullMQ data must never be evicted under memory pressure.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      [
        'discovery.type=single-node',
        'xpack.security.enabled=false',
        'ES_JAVA_OPTS=-Xms512m -Xmx512m',
      ]
    ports: ['9200:9200']
    volumes: ['elastic_data:/usr/share/elasticsearch/data']
    healthcheck:
      {
        test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null'],
        interval: 10s,
        timeout: 5s,
        retries: 20,
      }

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: reachinbox-api
    env_file: .env
    environment: *app-env
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'prisma/schema.prisma']
    depends_on: { postgres: { condition: service_healthy } }
  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: reachinbox-api
    env_file: .env
    environment: *app-env
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: reachinbox-api
    env_file: .env
    environment: *app-env
    command: ['node', 'dist/worker.js']
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: 'http://localhost:4000' }
    ports: ['3000:3000']
    depends_on: [api]

volumes: { postgres_data: {}, redis_data: {}, elastic_data: {} }
