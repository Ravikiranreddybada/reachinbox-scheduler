openapi: 3.1.0
info:
  title: ReachInbox Scheduler API
  version: 2.0.0
  description: Tenant-scoped API for durable email scheduling and operational search.
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    ScheduleRequest:
      type: object
      additionalProperties: false
      required: [sender, recipients, subject, body, scheduledAt, idempotencyKey]
      properties:
        sender: { type: string, format: email }
        senderName: { type: string, maxLength: 120 }
        recipients:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 998 }
        body: { type: string, minLength: 1, maxLength: 100000 }
        scheduledAt: { type: string, format: date-time }
        delayBetweenMs: { type: integer, minimum: 0, maximum: 3600000, default: 0 }
        hourlyLimit: { type: integer, minimum: 1, maximum: 10000 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [IDEMPOTENCY_KEY_REUSED, SCHEDULE_IN_PAST, SEARCH_UNAVAILABLE]
        requestId: { type: string }
    Status:
      type: string
      enum: [SCHEDULED, PROCESSING, SENT, FAILED, CANCELLED]
    ScheduleResponse:
      type: object
      required: [campaignId, accepted, replayed, startsAt, endsAt, byStatus]
      properties:
        campaignId: { type: string }
        accepted: { type: integer, description: Unique recipients scheduled }
        duplicatesRemoved: { type: integer }
        replayed: { type: boolean }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        byStatus: { type: object, additionalProperties: { type: integer } }
    EmailListItem:
      type: object
      properties:
        id: { type: string }
        campaignId: { type: string }
        recipient: { type: string }
        subject: { type: string }
        preview: { type: string, description: First 140 characters of the body }
        status: { $ref: '#/components/schemas/Status' }
        scheduledAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        attempts: { type: integer }
        errorMessage: { type: [string, 'null'] }
        providerMessageId: { type: [string, 'null'] }
    Campaign:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        recipientCount: { type: integer }
        hourlyLimit: { type: [integer, 'null'] }
        startsAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        progress:
          type: object
          properties:
            SCHEDULED: { type: integer }
            PROCESSING: { type: integer }
            SENT: { type: integer }
            FAILED: { type: integer }
            CANCELLED: { type: integer }
  parameters:
    Id: { in: path, name: id, required: true, schema: { type: string } }
  responses:
    RateLimited:
      description: Too many requests; see Retry-After and RateLimit-* headers
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200': { description: Process is alive }
  /health:
    get:
      summary: Dependency readiness
      responses:
        '200': { description: PostgreSQL and Redis are ready }
        '503': { description: A critical dependency is unavailable }
  /auth/me:
    get:
      security: [{ sessionCookie: [] }]
      summary: Current authenticated user
      responses:
        '200': { description: User profile and Slack connection status }
        '401': { description: Authentication required }
  /api/emails:
    post:
      security: [{ sessionCookie: [] }]
      summary: Schedule one campaign
      description: Replaying the same idempotency key and payload returns the original campaign.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '202':
          description: Campaign accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResponse' }
        '200':
          description: Idempotent replay of an accepted campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResponse' }
        '403': { description: Cross-site request blocked }
        '429': { $ref: '#/components/responses/RateLimited' }
        '400': { description: Invalid request }
        '409': { description: Idempotency key reused with a different payload }
        '422': { description: Scheduled time is in the past }
    get:
      security: [{ sessionCookie: [] }]
      summary: Cursor-paginated email list
      parameters:
        - {
            in: query,
            name: status,
            schema: { type: string },
            description: Comma-separated statuses,
          }
        - { in: query, name: campaignId, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Email page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EmailListItem' } }
                  nextCursor: { type: [string, 'null'] }
  /api/emails/stats:
    get:
      security: [{ sessionCookie: [] }]
      summary: Counts grouped by lifecycle status
      responses:
        '200': { description: Status counts }
  /api/emails/search:
    get:
      security: [{ sessionCookie: [] }]
      summary: Search the tenant's email projection
      parameters:
        - {
            in: query,
            name: q,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 200 },
          }
        - {
            in: query,
            name: status,
            schema: { type: string },
            description: Optional comma-separated lifecycle statuses,
          }
      responses:
        '200':
          description: Search results; matches in `preview` are wrapped in U+0002 … U+0003
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/EmailListItem' } }
        '503': { description: Search is temporarily unavailable }
  /api/emails/{id}:
    get:
      security: [{ sessionCookie: [] }]
      summary: One email with its full body and delivery details
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Email }
        '404': { description: Not found or owned by another tenant }
  /api/emails/{id}/cancel:
    post:
      security: [{ sessionCookie: [] }]
      summary: Cancel one scheduled email (compare-and-set on SCHEDULED)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Cancelled }
        '404': { description: Not found }
        '409': { description: Already processing, sent, failed, or cancelled }
  /api/emails/{id}/retry:
    post:
      security: [{ sessionCookie: [] }]
      summary: Re-queue one FAILED email (compare-and-set on FAILED)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Email is SCHEDULED again with a fresh job }
        '404': { description: Not found }
        '409': { description: Email is not in FAILED state }
  /api/settings:
    get:
      security: [{ sessionCookie: [] }]
      summary: Effective delivery limits (sender spacing, hourly caps) shown in the dashboard
      responses:
        '200': { description: Settings }
  /api/campaigns:
    get:
      security: [{ sessionCookie: [] }]
      summary: Campaigns with progress by status, newest first
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        '200':
          description: Campaign page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                  nextCursor: { type: [string, 'null'] }
  /api/campaigns/{id}:
    get:
      security: [{ sessionCookie: [] }]
      summary: One campaign with progress
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { description: Not found or owned by another tenant }
  /api/campaigns/{id}/cancel:
    post:
      security: [{ sessionCookie: [] }]
      summary: Cancel every email of the campaign that no worker has claimed
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaignId: { type: string }
                  cancelled: { type: integer }
                  inFlight: { type: integer, description: Emails already being sent }
  /api/senders:
    get:
      security: [{ sessionCookie: [] }]
      summary: Sender addresses of the user, with whether each has its own SMTP login
      responses:
        '200':
          description: Senders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        email: { type: string }
                        displayName: { type: string, nullable: true }
                        smtpConfigured: { type: boolean }
  /api/senders/{id}/smtp:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      security: [{ sessionCookie: [] }]
      summary: Set this sender's own SMTP login (password stored encrypted, never returned)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, password]
              properties:
                user: { type: string }
                password: { type: string }
                verify:
                  {
                    type: boolean,
                    default: true,
                    description: Check the login against the SMTP server first,
                  }
      responses:
        '200': { description: Saved }
        '404': { description: Sender not found }
        '422': { description: The SMTP server rejected the login }
    delete:
      security: [{ sessionCookie: [] }]
      summary: Remove the sender's own login; it falls back to the shared account
      responses:
        '204': { description: Removed }
  /api/suppressions:
    get:
      security: [{ sessionCookie: [] }]
      summary: The user's suppression list
      responses:
        '200': { description: Suppressed recipients (unsubscribe, bounce, complaint) }
    post:
      security: [{ sessionCookie: [] }]
      summary: Suppress a recipient (also the hook for a provider complaint or bounce webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                reason: { type: string, enum: [UNSUBSCRIBE, BOUNCE, COMPLAINT], default: COMPLAINT }
                note: { type: string }
      responses:
        '201': { description: Suppressed; unclaimed emails to this address are cancelled }
  /api/suppressions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      security: [{ sessionCookie: [] }]
      summary: Remove an address from the suppression list
      responses:
        '204': { description: Removed }
  /unsubscribe/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      summary: Confirmation page (does not unsubscribe; mail scanners prefetch links)
      responses:
        '200': { description: HTML page }
        '404': { description: Invalid token }
    post:
      summary: Unsubscribe (RFC 8058 one-click compatible). The signed token is the credential
      responses:
        '200': { description: Unsubscribed }
        '404': { description: Invalid token }
  /api/events:
    get:
      security: [{ sessionCookie: [] }]
      summary: Server-Sent Events stream of the tenant's status changes. Each frame has an `id`; send it back as `Last-Event-ID` after a reconnect to replay missed events. A `{"type":"resync"}` frame means some events are gone and the client should refetch.
      responses:
        '200':
          description: 'text/event-stream; each data frame is JSON such as {"type":"email.status","emailId":"…","status":"SENT"}'
  /auth/logout:
    post:
      summary: Revoke the current session immediately
      responses:
        '204': { description: Signed out }
  /metrics:
    get:
      summary: Prometheus metrics (bearer token when METRICS_TOKEN is set)
      responses:
        '200': { description: Prometheus text exposition }
